<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Hérès VPN - Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo-placeholder" aria-hidden="true">
                <div class="logo-icon"></div>
            </div>
            <h1 class="app-title">Hérès VPN</h1>
        </header>

        <section class="section">
            <div class="section-title">Provider</div>
            <div class="provider-tabs" role="tablist" aria-label="Cloud provider selection">
                <button class="provider-tab active" data-provider="scaleway" type="button">
                    Scaleway Stack
                </button>
                <button class="provider-tab" data-provider="digitalocean" type="button">
                    DigitalOcean Stack
                </button>
            </div>
        </section>

        <section id="scaleway-section" class="section">
            <div class="form-group">
                <label class="form-label" for="scaleway-zone">Zone</label>
                <div class="dropdown-wrapper">
                    <select id="scaleway-zone" class="dropdown-select">
                        <option value="">Select a zone...</option>
                        <option value="paris-1">Paris, France, zone 1</option>
                        <option value="paris-2">Paris, France, zone 2</option>
                        <option value="paris-3">Paris, France, zone 3</option>
                        <option value="amsterdam-1">Amsterdam, Netherlands, zone 1</option>
                        <option value="amsterdam-2">Amsterdam, Netherlands, zone 2</option>
                        <option value="amsterdam-3">Amsterdam, Netherlands, zone 3</option>
                        <option value="warsaw-1">Warsaw, Poland, zone 1</option>
                        <option value="warsaw-2">Warsaw, Poland, zone 2</option>
                        <option value="warsaw-3">Warsaw, Poland, zone 3</option>
                        <option value="milan">Milan, Italy</option>
                    </select>
                    <div class="chevron-icon" aria-hidden="true"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="scaleway-deploy" disabled type="button">
                    Deploy VPN
                </button>
                <button class="btn btn-destructive" id="scaleway-destroy" disabled type="button">
                    Destroy VPN
                </button>
            </div>
        </section>

        <section id="digitalocean-section" class="section hidden-section">
            <div class="form-group">
                <label class="form-label" for="do-region">Region</label>
                <div class="dropdown-wrapper">
                    <select id="do-region" class="dropdown-select">
                        <option value="">Select a region...</option>
                        <option value="nyc1">New York, USA, zone 1</option>
                        <option value="nyc3">New York, USA, zone 2</option>
                        <option value="sfo1">San Francisco, USA, zone 1</option>
                        <option value="sfo3">San Francisco, USA, zone 2</option>
                        <option value="ams3">Amsterdam, Netherlands</option>
                        <option value="fra1">Frankfurt, Germany</option>
                        <option value="lon1">London, United Kingdom</option>
                        <option value="sgp1">Singapore</option>
                        <option value="blr1">Bangalore, India</option>
                        <option value="tor1">Toronto, Canada</option>
                    </select>
                    <div class="chevron-icon" aria-hidden="true"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="do-deploy" disabled type="button">
                    Deploy VPN
                </button>
                <button class="btn btn-destructive" id="do-destroy" disabled type="button">
                    Destroy VPN
                </button>
            </div>
        </section>

        <section id="status-card" class="status-card">
            <div class="status-header">
                <div class="status-indicator" id="status-dot"></div>
                <div>
                    <div class="status-label">VPN Status</div>
                    <div class="status-value" id="status-text">Disconnected</div>
                </div>
            </div>

            <div class="status-row">
                <span class="status-row-label">Public IP Address</span>
                <div class="status-row-content">
                    <div class="ip-address" id="ip-address">—</div>
                </div>
            </div>

            <div class="status-row status-row-qr">
                <span class="status-row-label">WireGuard Config</span>
                <div class="status-row-content">
                    <div class="qr-frame">
                        <div id="qrcode" class="qrcode" aria-label="WireGuard QR code"></div>
                        <div class="qr-caption">QRCode.js renders the client config here.</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>

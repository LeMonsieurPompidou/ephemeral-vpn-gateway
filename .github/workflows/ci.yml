name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r vpn-gui-app/requirements.txt -r requirements-dev.txt
      - run: ruff format --check vpn-gui-app tests
      - run: ruff check vpn-gui-app tests
      - run: mypy
      - run: pytest
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix: {root: [vpn-digitalocean, vpn-scaleway, vpn-aws-lightsail]}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=${{ matrix.root }} init -backend=false
      - run: terraform -chdir=${{ matrix.root }} validate
